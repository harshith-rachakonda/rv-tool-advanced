; PMF.RV -- studio network configuration
;
; The one place that says where PMF.RV's servers are. It ships with every
; install and is updated through auto-update like any other file.
;
; Moving a server: put the NEW address first in the list (keep the old one
; after it), publish, and give everyone a launch to pick it up; only then
; switch the old machine off and remove its address in a later release.
; Publishing only to the new location would never reach anyone.
;
; Interim: the dev machine REVIEW-SERVER (studio LAN 192.0.2.10, Tailscale
; 100.64.0.10) is both the update share and the room server, until IT
; provides a permanent always-on server reachable from every network.

[update]
; Shared release folders that RVTool.exe updates from, tried in order (the
; first one that answers wins). The host name is a fallback in case the IP
; address ever changes; the 100.x address is the same share over Tailscale,
; for reviewers outside the studio network.
sources = \\192.0.2.10\PMF.RVTOOL_release, \\REVIEW-SERVER\PMF.RVTOOL_release, \\100.64.0.10\PMF.RVTOOL_release

[room]
; PMF.RV Room servers (PMFRoomServer.exe, TCP 45150), tried in order by
; Create Room / Join Room. Every participant only needs OUTBOUND TCP to one
; of them; nobody needs an inbound firewall rule.
;   192.0.2.10  studio LAN address
;   100.64.0.10   same machine via Tailscale, for off-site reviewers
;   REVIEW-SERVER   host-name fallback in case the LAN address changes
servers = 192.0.2.10:45150, 100.64.0.10:45150, REVIEW-SERVER:45150
