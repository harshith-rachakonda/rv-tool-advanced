;; ---------------------------------------------------------------
;; PMF.RV — FORCED SETTINGS MIGRATION
;; ---------------------------------------------------------------
;; Unlike OpenRV.ini (first-run defaults — only fills gaps, never
;; overwrites), every key listed here gets FORCE-WRITTEN into each
;; artist's live settings once per shipped version (see RVTool.cs,
;; TryMigrateSettings). This is what fixes a machine stuck with old
;; values from a previous RV/OpenRV install.
;;
;; Only put studio-wide settings here — never anything personal
;; (audio device name, window position, contacts). Those must stay
;; artist-controlled and are deliberately left out.
;;
;; Bump VERSION.txt whenever this file changes, or the migration
;; will not re-run (it's gated on "have I already migrated for the
;; CURRENT shipped version").
;; ---------------------------------------------------------------

[%General]
networkOnStartup=true

[Caching]
cacheMode=2
lookAheadCacheSize64New=1.5
regionCacheSize64New=1

[Network]
defaultPermission=1
primaryPort=45124

[Sync]
send=annotation, color, view, stereo
block=
; false = star topology: the room host relays everyone's events (sync.mu
; _broadcastExternalEvents). pmf.8 set this true (full mesh), which needs
; every PC to reach every other PC directly by hostname and re-inserts
; strokes in a loop with 3+ people -- see VERSION.txt pmf.10.
syncWithContactsContactsV2=false
; false = no blocking "Network Error: remote host closed the connection"
; dialog every time a peer drops. That modal stalled PMF.RV Room's
; automatic reconnect (someone had to click OK first); the room plugin
; shows its own non-blocking "lost connection -- reconnecting" notice.
; Per-user toggle: Sync -> Settings -> Show Contacts Network Errors.
showContactErrors=false

[ModeManager]
doNotLoadPackages=$APPLICATION_DIR/plugins/Packages/eof_safety-1.0.rvpkg, $APPLICATION_DIR/plugins/Packages/ocio_source_setup-2.5.rvpkg
optionalPackages=$APPLICATION_DIR/plugins/Packages/channel_select-1.3.rvpkg, $APPLICATION_DIR/plugins/Packages/data_display_indicators-1.2.rvpkg, $APPLICATION_DIR/plugins/Packages/layer_select-1.7.rvpkg, $APPLICATION_DIR/plugins/Packages/missing_frame_bling-1.7.rvpkg
